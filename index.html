                                                                                                                                                                                                                                                                                                                                             const D = derive();
                                                                                                                                                                                                                                                                                                                                             return CONTENT.share.replace('{type}', D.type.title) + ' ' + location.href.split('#')[0];
                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                                                             
                                                                                                                                                                                                                                                                                                                                             /* ============================================================
                                                                                                                                                                                                                                                                                                                                                6. SCREEN-SPECIFIC UI UPDATES
                                                                                                                                                                                                                                                                                                                                                   ============================================================ */
                                                                                                                                                                                                                                                                                                                                                   function updateAreaUI(){
                                                                                                                                                                                                                                                                                                                                                   stage.querySelectorAll('[data-act=area]').forEach(b=>{
                                                                                                                                                                                                                                                                                                                                                   const on = S.areas.includes(b.dataset.id);
                                                                                                                                                                                                                                                                                                                                                   b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
                                                                                                                                                                                                                                                                                                                                                   });
                                                                                                                                                                                                                                                                                                                                                   const ph = document.getElementById('areaPhrase'), nx = document.getElementById('next');
                                                                                                                                                                                                                                                                                                                                                   if(!ph || !nx) return;
                                                                                                                                                                                                                                                                                                                                                   if(!S.areas.length){ ph.hidden = true; nx.disabled = true; return; }
                                                                                                                                                                                                                                                                                                                                                   let t = CONTENT.areaPhrases[S.areas[0]];
                                                                                                                                                                                                                                                                                                                                                   if(S.areas.length>1) t += CONTENT.areaMany;
                                                                                                                                                                                                                                                                                                                                                   ph.textContent = t; ph.hidden = false; nx.disabled = false;
                                                                                                                                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                                                                                                                                   function updateScoreUI(){
                                                                                                                                                                                                                                                                                                                                                   document.getElementById('scoreBig').innerHTML = `${S.score}<small>/10</small>`;
                                                                                                                                                                                                                                                                                                                                                   document.getElementById('scoreCap').textContent = CONTENT.scoreText.replace('{n}', S.score);
                                                                                                                                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                                                                                                                                   function updateHoursUI(){
                                                                                                                                                                                                                                                                                                                                                   document.getElementById('hoursBig').innerHTML = `${S.day.hours}<small>ч</small>`;
                                                                                                                                                                                                                                                                                                                                                   document.getElementById('hoursCap').textContent = CONTENT.hoursLabel(S.day.hours);
                                                                                                                                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                                                                                                                                   const AFTER = {
                                                                                                                                                                                                                                                                                                                                                   areas: updateAreaUI,
                                                                                                                                                                                                                                                                                                                                                   score: updateScoreUI,
                                                                                                                                                                                                                                                                                                                                                   day(st){ if(st.k==='hours') updateHoursUI(); }
                                                                                                                                                                                                                                                                                                                                                   };
                                                                                                                                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                                                                                                                   /* ============================================================
                                                                                                                                                                                                                                                                                                                                                      7. NAVIGATION
                                                                                                                                                                                                                                                                                                                                                         ============================================================ */
                                                                                                                                                                                                                                                                                                                                                         const backBtn = document.getElementById('back');
                                                                                                                                                                                                                                                                                                                                                         const countEl = document.getElementById('count');
                                                                                                                                                                                                                                                                                                                                                         const barFill = document.getElementById('barFill');
                                                                                                                                                                                                                                                                                                                                                         let lock = false;
                                                                                                                                                                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                                                                                                         function render(dir){
                                                                                                                                                                                                                                                                                                                                                         const st = STEPS[S.step];
                                                                                                                                                                                                                                                                                                                                                         if(st.id==='map' && !S.barrier){ S.step = IDX('barrier'); return render(dir); }
                                                                                                                                                                                                                                                                                                                                                         backBtn.classList.toggle('off', S.step===0);
                                                                                                                                                                                                                                                                                                                                                         countEl.textContent = st.g<=8 ? `${st.g} / 8` : 'Готово';
                                                                                                                                                                                                                                                                                                                                                         barFill.style.width = (S.step/(STEPS.length-1)*100).toFixed(1)+'%';
                                                                                                                                                                                                                                                                                                                                                         stage.innerHTML = VIEWS[st.id](st);
                                                                                                                                                                                                                                                                                                                                                         const sc = stage.firstElementChild;
                                                                                                                                                                                                                                                                                                                                                         if(sc && dir) sc.classList.add(dir==='back'?'go-back':'go-fwd');
                                                                                                                                                                                                                                                                                                                                                         if(AFTER[st.id]) AFTER[st.id](st);
                                                                                                                                                                                                                                                                                                                                                         const h = stage.querySelector('h1'); if(h) h.focus({preventScroll:true});
                                                                                                                                                                                                                                                                                                                                                         window.scrollTo(0,0);
                                                                                                                                                                                                                                                                                                                                                         track('step_view', {step:st.id, i:st.i!=null?st.i:undefined});
                                                                                                                                                                                                                                                                                                                                                         if(st.id==='map' && !fired.result){ fired.result = 1; track('result_view', {type:derive().type.code}); }
                                                                                                                                                                                                                                                                                                                                                         if(st.id==='map' && !fired.offer){ fired.offer = 1; track('telegram_cta_view'); }
                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                         function setStep(n, dir){ S.step = Math.max(0, Math.min(STEPS.length-1, n)); save(); render(dir); }
                                                                                                                                                                                                                                                                                                                                                         function evProps(st){
                                                                                                                                                                                                                                                                                                                                                         switch(st.id){
                                                                                                                                                                                                                                                                                                                                                         case 'areas':   return {areas:S.areas};
                                                                                                                                                                                                                                                                                                                                                         case 'score':   return {score:S.score};
                                                                                                                                                                                                                                                                                                                                                         case 'desire':  return {desire:S.desire};
                                                                                                                                                                                                                                                                                                                                                         case 'barrier': return {barrier:S.barrier};
                                                                                                                                                                                                                                                                                                                                                         case 'hook':    return {has_name:!!S.name};
                                                                                                                                                                                                                                                                                                                                                         default: return {};
                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                         function advance(){
                                                                                                                                                                                                                                                                                                                                                         const st = STEPS[S.step];
                                                                                                                                                                                                                                                                                                                                                         if(st.ev) [].concat(st.ev).forEach(e=>track(e, evProps(st)));
                                                                                                                                                                                                                                                                                                                                                         setStep(S.step+1, 'fwd');
                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                         function choose(btn, apply){
                                                                                                                                                                                                                                                                                                                                                         if(lock) return;
                                                                                                                                                                                                                                                                                                                                                         const at = S.step;
                                                                                                                                                                                                                                                                                                                                                         apply();
                                                                                                                                                                                                                                                                                                                                                         btn.parentElement.querySelectorAll('.opt,.card').forEach(b=>b.classList.remove('on'));
                                                                                                                                                                                                                                                                                                                                                         btn.classList.add('on');
                                                                                                                                                                                                                                                                                                                                                         save();
                                                                                                                                                                                                                                                                                                                                                         lock = true;
                                                                                                                                                                                                                                                                                                                                                         setTimeout(()=>{ lock = false; if(S.step===at) advance(); }, CONFIG.ADVANCE_MS);
                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                                                                                                         /* ============================================================
                                                                                                                                                                                                                                                                                                                                                            8. EVENTS
                                                                                                                                                                                                                                                                                                                                                               ============================================================ */
                                                                                                                                                                                                                                                                                                                                                               backBtn.addEventListener('click', ()=>{ if(S.step>0) setStep(S.step-1,'back'); });
                                                                                                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                                                                                               stage.addEventListener('click', e=>{
                                                                                                                                                                                                                                                                                                                                                               const t = e.target.closest('[data-act]');
                                                                                                                                                                                                                                                                                                                                                               if(!t) return;
                                                                                                                                                                                                                                                                                                                                                               const act = t.dataset.act, st = STEPS[S.step];
                                                                                                                                                                                                                                                                                                                                                               switch(act){
                                                                                                                                                                                                                                                                                                                                                               case 'next': advance(); break;
                                                                                                                                                                                                                                                                                                                                                               case 'resume': S = Object.assign(fresh(), RESUME); RESUME = null; setStep(S.step,'fwd'); break;
                                                                                                                                                                                                                                                                                                                                                               case 'restart': clearSaved(); S = fresh(); RESUME = null; Object.keys(fired).forEach(k=>delete fired[k]); setStep(0,'back'); break;
                                                                                                                                                                                                                                                                                                                                                               case 'area': {
                                                                                                                                                                                                                                                                                                                                                               const id = t.dataset.id;
                                                                                                                                                                                                                                                                                                                                                               if(id==='unknown') S.areas = S.areas.includes('unknown') ? [] : ['unknown'];
                                                                                                                                                                                                                                                                                                                                                               else {
                                                                                                                                                                                                                                                                                                                                                               S.areas = S.areas.filter(a=>a!=='unknown');
                                                                                                                                                                                                                                                                                                                                                               S.areas = S.areas.includes(id) ? S.areas.filter(a=>a!==id) : S.areas.concat(id);
                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                               save(); updateAreaUI(); break;
                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                               case 'free': choose(t, ()=>{ S.freedom[st.i] = t.dataset.v; }); break;
                                                                                                                                                                                                                                                                                                                                                               case 'day':  choose(t, ()=>{ S.day[t.dataset.k] = t.dataset.v; }); break;
                                                                                                                                                                                                                                                                                                                                                               case 'desire': {
                                                                                                                                                                                                                                                                                                                                                               if(t.dataset.id==='custom'){
                                                                                                                                                                                                                                                                                                                                                               S.desire = 'custom'; save();
                                                                                                                                                                                                                                                                                                                                                               stage.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on', b===t));
                                                                                                                                                                                                                                                                                                                                                               document.getElementById('customBox').hidden = false;
                                                                                                                                                                                                                                                                                                                                                               document.getElementById('customDesire').focus();
                                                                                                                                                                                                                                                                                                                                                               } else {
                                                                                                                                                                                                                                                                                                                                                               document.getElementById('customBox').hidden = true;
                                                                                                                                                                                                                                                                                                                                                               document.getElementById('customNext').hidden = true;
                                                                                                                                                                                                                                                                                                                                                               choose(t, ()=>{ S.desire = t.dataset.id; });
                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                               break;
                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                               case 'why1': choose(t, ()=>{ S.ladder.q1 = t.dataset.id; }); break;
                                                                                                                                                                                                                                                                                                                                                               case 'why1text': S.ladder.q1 = S.ladder.q1text.trim(); save(); advance(); break;
                                                                                                                                                                                                                                                                                                                                                               case 'why2': choose(t, ()=>{ S.ladder.q2 = t.dataset.id; }); break;
                                                                                                                                                                                                                                                                                                                                                               case 'why3': choose(t, ()=>{ S.ladder.q3 = t.dataset.id; }); break;
                                                                                                                                                                                                                                                                                                                                                               case 'barrier': choose(t, ()=>{ S.barrier = t.dataset.id; }); break;
                                                                                                                                                                                                                                                                                                                                                               case 'copy': {
                                                                                                                                                                                                                                                                                                                                                               const txt = shareText();
                                                                                                                                                                                                                                                                                                                                                               track('share_click', {channel:'copy'});
                                                                                                                                                                                                                                                                                                                                                               const done = () => { t.textContent = 'Скопировано'; setTimeout(()=>{ t.textContent = 'Скопировать текст для сторис'; }, 2000); };
                                                                                                                                                                                                                                                                                                                                                               const fallback = () => {
                                                                                                                                                                                                                                                                                                                                                               const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
                                                                                                                                                                                                                                                                                                                                                               document.body.appendChild(ta); ta.select();
                                                                                                                                                                                                                                                                                                                                                               try{ document.execCommand('copy'); done(); }catch(err){}
                                                                                                                                                                                                                                                                                                                                                               ta.remove();
                                                                                                                                                                                                                                                                                                                                                               };
                                                                                                                                                                                                                                                                                                                                                               if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
                                                                                                                                                                                                                                                                                                                                                               else fallback();
                                                                                                                                                                                                                                                                                                                                                               break;
                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                               case 'share': track('share_click', {channel:'telegram'}); break;
                                                                                                                                                                                                                                                                                                                                                               case 'tg': track('telegram_click', {type: derive().type.code}); break;
                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                               });
                                                                                                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                                                                                               stage.addEventListener('input', e=>{
                                                                                                                                                                                                                                                                                                                                                               const id = e.target.id, v = e.target.value;
                                                                                                                                                                                                                                                                                                                                                               if(id==='name'){ S.name = v.trim().slice(0,40); save(); }
                                                                                                                                                                                                                                                                                                                                                               else if(id==='score'){ S.score = +v; save(); updateScoreUI(); }
                                                                                                                                                                                                                                                                                                                                                               else if(id==='hours'){ S.day.hours = +v; save(); updateHoursUI(); }
                                                                                                                                                                                                                                                                                                                                                               else if(id==='dayFeel'){ S.day.feel = v.trim(); save(); }
                                                                                                                                                                                                                                                                                                                                                               else if(id==='customDesire'){ S.desireCustom = v; save(); document.getElementById('customNext').hidden = v.trim().length<=2; }
                                                                                                                                                                                                                                                                                                                                                               else if(id==='why1text'){ S.ladder.q1text = v; document.getElementById('why1btn').hidden = v.trim().length<3; }
                                                                                                                                                                                                                                                                                                                                                               });
                                                                                                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                                                                                               /* ============================================================
                                                                                                                                                                                                                                                                                                                                                                  9. START
                                                                                                                                                                                                                                                                                                                                                                     ============================================================ */
                                                                                                                                                                                                                                                                                                                                                                     RESUME = loadSaved();
                                                                                                                                                                                                                                                                                                                                                                     track('landing_view');
                                                                                                                                                                                                                                                                                                                                                                     render(null);
                                                                                                                                                                                                                                                                                                                                                                     </script>
                                                                                                                                                                                                                                                                                                                                                                     </body>
                                                                                                                                                                                                                                                                                                                                                                     </html>
