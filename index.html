<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#ECEAE6">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}

<title>Карта жизни мечты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, one question per screen. Thin-line editorial look.
   The seven-spoke compass motif appears on the first screen and again as the result radar. */
   :root{
     --bg:#ECEAE6;
       --surface:#F5F4F1;
         --fg:#1E1C1D;
           --muted:#6B6568;
             --line:#CBC6C3;
               --accent:#7B2D4A;
                 --on-accent:#FFFFFF;
                   --soft:#E3D5DA;
                     --f-display:'Cormorant Garamond','Times New Roman',serif;
                       --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
                       }
                       @media (prefers-color-scheme: dark){
                         :root:not([data-theme="light"]){
                             --bg:#151214;--surface:#1E1A1C;--fg:#ECE7E4;--muted:#A39DA0;--line:#3B3538;--accent:#E09AB3;--on-accent:#1A0E13;--soft:#3A2630;
                                 color-scheme:dark;
                                   }
                                   }
                                   :root[data-theme="dark"]{
                                     --bg:#151214;--surface:#1E1A1C;--fg:#ECE7E4;--muted:#A39DA0;--line:#3B3538;--accent:#E09AB3;--on-accent:#1A0E13;--soft:#3A2630;
                                       color-scheme:dark;
                                       }
                                       html,body{height:100%}
                                       body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--f-body);padding-inline:20px;-webkit-font-smoothing:antialiased}
                                       *{box-sizing:border-box}
                                       button,input,textarea{font-family:inherit}
                                       :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
                                       h1:focus,h2:focus{outline:none}

                                       .app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
                                       .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:10px}
                                       .top-row{display:flex;align-items:center;justify-content:space-between;height:44px}
                                       .back{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
                                       .back.off{visibility:hidden}
                                       .count{font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
                                       .bar{height:2px;background:var(--line)}
                                       .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.2,1)}

                                       #stage{flex:1;display:flex;flex-direction:column}
                                       .screen{flex:1;display:flex;flex-direction:column;gap:22px;padding-block:28px 40px;min-height:70vh;min-height:calc(100dvh - 100px);position:relative}
                                       .screen.go-fwd{animation:in-fwd .38s cubic-bezier(.2,.7,.2,1) both}
                                       .screen.go-back{animation:in-back .38s cubic-bezier(.2,.7,.2,1) both}
                                       @keyframes in-fwd{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
                                       @keyframes in-back{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

                                       .eyebrow{font:600 11px/1.3 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
                                       h1{font:500 clamp(33px,9.2vw,46px)/1.05 var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
                                       h1.m{font-size:clamp(28px,7.6vw,36px);line-height:1.1}
                                       .lead{color:var(--muted);font-size:17px;line-height:1.5;margin:0;max-width:34em}
                                       .lead.q{font:italic 500 23px/1.25 var(--f-display);color:var(--fg)}
                                       .fine{font-size:13px;color:var(--muted);margin:0;text-align:center}
                                       .spacer{flex:1}

                                       .opts{display:flex;flex-direction:column;gap:10px}
                                       .opt{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:58px;padding:14px 16px;text-align:left;font:500 16px/1.3 var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:border-color .2s,background .2s}
                                       .opt:active{transform:scale(.99)}
                                       .opt .mark{position:relative;flex:none;width:20px;height:20px;border:1px solid var(--muted);border-radius:50%}
                                       .opt.multi .mark{border-radius:3px}
                                       .opt.on{border-color:var(--accent);background:var(--soft)}
                                       .opt.on .mark{background:var(--accent);border-color:var(--accent)}
                                       .opt.on .mark::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
                                       .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
                                       .card{display:flex;align-items:flex-end;min-height:112px;padding:14px;text-align:left;font:500 22px/1.15 var(--f-display);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:border-color .2s,background .2s;min-width:0}
                                       .card.on{border-color:var(--accent);background:var(--soft)}
                                       .yn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
                                       .yn .opt{justify-content:center;min-height:68px;text-align:center}

                                       .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:0 24px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:6px;font:600 16px/1 var(--f-body);letter-spacing:.02em;cursor:pointer;text-decoration:none;text-align:center}
                                       .btn[disabled]{opacity:.35;cursor:default}
                                       .btn.ghost{background:none;color:var(--fg);border-color:var(--line)}
                                       .btn-row{display:grid;gap:10px}
                                       .link{background:none;border:0;color:var(--muted);text-decoration:underline;font:500 14px/1.4 var(--f-body);cursor:pointer;padding:10px 0;align-self:center}

                                       .insight{border-top:1px solid var(--line);padding-top:16px;margin:0;font:italic 500 24px/1.25 var(--f-display)}
                                       .fld{display:flex;flex-direction:column;gap:2px}
                                       .fld span{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
                                       .txt{width:100%;padding:12px 0;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--fg);font:500 17px/1.4 var(--f-body)}
                                       .txt:focus{outline:none;border-bottom-color:var(--accent)}
                                       textarea.txt{resize:none;min-height:84px}
                                       .dots{display:flex;gap:6px}
                                       .dots i{width:18px;height:2px;background:var(--line)}
                                       .dots i.on{background:var(--accent)}

                                       input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:none;margin:0;cursor:pointer}
                                       input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--fg)}
                                       input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:var(--accent);border:4px solid var(--bg);box-shadow:0 0 0 1px var(--accent)}
                                       input[type=range]::-moz-range-track{height:1px;background:var(--fg)}
                                       input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:4px solid var(--bg);box-shadow:0 0 0 1px var(--accent)}
                                       .big{font:500 112px/.9 var(--f-display);color:var(--accent);font-variant-numeric:lining-nums tabular-nums}
                                       .big small{font-size:34px;color:var(--muted);margin-left:6px}
                                       .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-inline:4px}

                                       .orn{position:absolute;top:-6px;right:-30px;width:230px;height:230px;pointer-events:none}
                                       .hero>*:not(.orn){position:relative}
                                       .resume{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:14px 16px;display:grid;gap:8px}
                                       .resume p{margin:0;font-size:14px;color:var(--muted)}
                                       .resume .row2{display:flex;gap:10px;flex-wrap:wrap}
                                       .resume .btn{min-height:44px;width:auto;flex:1;font-size:14px}

                                       .chain{border-left:1px solid var(--accent);margin-left:3px;padding-left:14px;display:flex;flex-direction:column;gap:12px}
                                       .chain p{margin:0;font-size:16px;line-height:1.35}
                                       .chain span{display:block;font:600 10px/1.4 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

                                       .radar{width:100%;max-width:380px;height:auto;margin:0 auto;display:block}
                                       .radar .ring{fill:none;stroke:var(--line);stroke-width:1}
                                       .radar .spoke{stroke:var(--line);stroke-width:1}
                                       .radar .shape{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round;transform-origin:180px 160px;animation:grow .9s .15s cubic-bezier(.2,.7,.2,1) both}
                                       .radar .dot{fill:var(--accent)}
                                       .radar .lbl{font:600 11px var(--f-body);fill:var(--muted)}
                                       .radar .lbl.sel{fill:var(--fg)}
                                       .radar .lbl.main{fill:var(--accent);font-weight:700}
                                       @keyframes grow{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
                                       .legend{margin:-8px 0 0;font-size:12px;color:var(--muted);text-align:center}

                                       .type{display:grid;gap:10px;border-top:1px solid var(--accent);padding-top:18px}
                                       .type h2{font:500 clamp(34px,9vw,44px)/1.02 var(--f-display);margin:0;color:var(--accent)}
                                       .type p{margin:0;font-size:17px}
                                       .rows{border-top:1px solid var(--line);margin:0}
                                       .rows>div{display:grid;gap:4px;padding:14px 0;border-bottom:1px solid var(--line);animation:rise .6s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
                                       .rows dt{font:600 10px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
                                       .rows dd{margin:0;font:500 18px/1.35 var(--f-body)}
                                       @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
                                       .concl{font:italic 500 26px/1.22 var(--f-display);margin:0;text-wrap:pretty}
                                       .mod{margin:0;font-size:15px;color:var(--muted)}
                                       details.tue{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
                                       details.tue summary{cursor:pointer;font:600 11px/1.4 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
                                       details.tue ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;font-size:15px}
                                       details.tue li b{display:block;font:600 10px/1.4 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
                                       .sig{font:italic 500 22px/1 var(--f-display);color:var(--muted);margin:0}
                                       details.dev{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--muted)}
                                       details.dev summary{cursor:pointer}
                                       details.dev pre{margin:10px 0 0;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all;overflow-x:auto;max-width:100%;color:var(--fg)}

                                       .next{display:grid;gap:12px}
                                       .lock{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
                                       .lock li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:16px}
                                       .lock svg{flex:none;color:var(--accent)}

                                       .go{display:grid;gap:16px;border-top:1px solid var(--line);padding-top:24px}
                                       .step-h{font:500 clamp(30px,8vw,38px)/1.08 var(--f-display);margin:0;text-wrap:balance}
                                       @media (prefers-reduced-motion: reduce){
                                         .screen.go-fwd,.screen.go-back,.radar .shape,.rows>div{animation:none}
                                           .bar i{transition:none}
                                           }
                                           </style>

                                           </head>
                                           <body>
                                           <div class="app">
                                             <header class="top">
                                                 <div class="top-row">
                                                       <button class="back off" id="back" type="button" aria-label="Назад">
                                                               <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3L5 9l6 6"/></svg>
                                                                     </button>
                                                                           <div class="count" id="count">1 / 8</div>
                                                                               </div>
                                                                                   <div class="bar"><i id="barFill"></i></div>
                                                                                     </header>
                                                                                       <main id="stage"></main>
                                                                                       </div>

                                                                                       <script>
                                                                                       /* ============================================================
                                                                                          1. CONFIG — меняется под запуск
                                                                                             ============================================================ */
                                                                                             const CONFIG = {
                                                                                               BOT: 'YOUR_BOT_USERNAME',          // username Telegram-бота без @ (бот подключён в SendPulse)
                                                                                                 FLOW_ID: 'YOUR_FLOW_ID',           // ID потока SendPulse с разбором карты (виден в адресной строке редактора)
                                                                                                   STORAGE_KEY: 'karta-zhizni-mechty-v1',
                                                                                                     SHOW_DEV: false,                    // панель «данные для бота и события» на последнем экране; в проде false
                                                                                                       ADVANCE_MS: 300                    // пауза после выбора ответа перед переходом
                                                                                                       };
                                                                                                       
                                                                                                       /* ============================================================
                                                                                                          2. CONTENT — все тексты, варианты ответов и логика результата.
                                                                                                                UI ниже читает только эти данные.
                                                                                                                   ============================================================ */
                                                                                                                   const CONTENT = {
                                                                                                                     areas: [
                                                                                                                         {id:'money',  label:'Деньги',                  radar:'Деньги',     code:'mn'},
                                                                                                                             {id:'love',   label:'Отношения',               radar:'Отношения',  code:'lv'},
                                                                                                                                 {id:'work',   label:'Работа и реализация',     radar:'Реализация', code:'wk'},
                                                                                                                                     {id:'home',   label:'Дом и образ жизни',       radar:'Дом',        code:'hm'},
                                                                                                                                         {id:'energy', label:'Состояние и энергия',     radar:'Состояние',  code:'en'},
                                                                                                                                             {id:'freedom',label:'Свобода и путешествия',   radar:'Свобода',    code:'fr'},

                                                                                                                                                     {id:'unknown',label:'Хочу перемен, но пока не понимаю каких', radar:null, code:'un'}
                                                                                                                                                       ],
                                                                                                                                                         radarOrder: ['love','money','work','home','freedom','energy','self'],
                                                                                                                                                           areaPhrases: {
                                                                                                                                                               money:  'Похоже, тебе важно перестать считать каждый шаг и почувствовать опору под ногами.',
                                                                                                                                                                   love:   'Похоже, тебе хочется близости, в которой не нужно стараться быть удобной.',
                                                                                                                                                                       work:   'Похоже, тебе тесно в роли, которая давно не про тебя.',
                                                                                                                                                                           home:   'Похоже, тебе нужно пространство, которое выглядит и ощущается как ты.',
                                                                                                                                                                               energy: 'Похоже, ты слишком долго держишься на силе воли.',
                                                                                                                                                                                   freedom:'Похоже, сейчас тебе особенно важно вернуть ощущение свободы и возможностей.',
                                                                                                                                                                                       self:   'Похоже, тебе хочется наконец встать на свою сторону.',
                                                                                                                                                                                           unknown:'Хотеть перемен и не знать каких — нормальная точка старта. Мы её как раз и найдём.'
                                                                                                                                                                                             },
                                                                                                                                                                                               areaMany: ' Сфер несколько. Дальше найдём, какая из них главная.',
                                                                                                                                                                                                 scoreText: 'Ты сейчас на {n}/10. Это не значит, что с твоей жизнью что-то не так. Это точка, из которой мы начинаем.',
                                                                                                                                                                                                   freedomIntro: 'Представь, что никто никогда не узнает о твоём выборе.',
                                                                                                                                                                                                     freedomHint: 'Первое, что пришло в голову, и есть самый честный ответ.',
                                                                                                                                                                                                       freedom: [
                                                                                                                                                                                                           'Ты бы продолжила работать там, где работаешь сейчас?',
                                                                                                                                                                                                               'Ты бы выбрала свою нынешнюю ситуацию в отношениях?',
                                                                                                                                                                                                                   'Ты бы продолжила жить в этом городе?',
                                                                                                                                                                                                                       'Ты бы хотела зарабатывать столько же?',
                                                                                                                                                                                                                           'Ты бы продолжила жить в таком ритме?'
                                                                                                                                                                                                                             ],
                                                                                                                                                                                                                               dayIntro: 'Теперь забудь о целях. Представь обычный вторник твоей жизни мечты.',
                                                                                                                                                                                                                                 day: [
                                                                                                                                                                                                                                     {k:'place',  kind:'cards', label:'Просыпаешься', q:'Где ты просыпаешься?',
                                                                                                                                                                                                                                           opts:['У моря','В городе, который мне нравится','За городом, среди природы','Там, где сейчас, но всё иначе']},
                                                                                                                                                                                                                                               {k:'company',kind:'cards', label:'Рядом', q:'Кто рядом с тобой утром?',
                                                                                                                                                                                                                                                     opts:['Я одна, и мне хорошо','Партнёр','Партнёр и дети','Близкие люди неподалёку']},
                                                                                                                                                                                                                                                         {k:'morning',kind:'cards', label:'Утро', q:'Как начинается утро?',

                                                                                                                                                                                                                                                                   {k:'hours',  kind:'range', label:'Работа', q:'Сколько времени в этот день занимает работа?'},

                                                                                                                                                                                                                                                                                                             needs: {

                                                                                                                                                                                                                                                                                                             freedom:  {label:'свободу',                    code:'fr'},
                                                                                                                                                                                                                                                                                                             closeness:{label:'близость',                   code:'cl'},
                                                                                                                                                                                                                                                                                                             worth:    {label:'ощущение своей ценности',    code:'wo'},
                                                                                                                                                                                                                                                                                                             ease:     {label:'лёгкость',                   code:'ea'},
                                                                                                                                                                                                                                                                                                             agency:   {label:'право решать самой',         code:'ag'},
                                                                                                                                                                                                                                                                                                             trust:    {label:'доверие к себе',             code:'tr'}
                                                                                                                                                                                                                                                                                                             },
                                                                                                                                                                                                                                                                                                               desires: [
                                                                                                                                                                                                                                                                                                               {id:'home',   area:'home',   need:'safety',   short:'свой дом',            label:'Свой дом, в котором мне хорошо'},
                                                                                                                                                                                                                                                                                                               {id:'money',  area:'money',  need:'agency',   short:'деньги',              label:'Доход, при котором не нужно считать каждый расход'},
                                                                                                                                                                                                                                                                                                               {id:'love',   area:'love',   need:'closeness',short:'отношения',           label:'Близость, в которой можно быть собой'},

                                                                                                                                                                                                                                                                                                                                 function rid(){ return Math.random().toString(36).slice(2,8).padEnd(6,'0'); }
                                                                                                                                                                                                                                                                                                                                 function fresh(){
                                                                                                                                                                                                                                                                                                                                 return {step:0, sid:rid(), name:'', areas:[], score:5, freedom:[], day:{hours:5}, desire:null, desireCustom:'',
                                                                                                                                                                                                                                                                                                                                 ladder:{q1:'', q1text:'', q2:'', q3:''}, barrier:null};

                                                                                                                                                                                                                                                                                                                                 let S = fresh();

                                                                                                                                                                                                                                                                                                                                 const fired = {};
                                                                                                                                                                                                                                                                                                                                 
                                                                                                                                                                                                                                                                                                                                 function save(){ try{ localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(S)); }catch(e){} }
                                                                                                                                                                                                                                                                                                                                 function loadSaved(){
                                                                                                                                                                                                                                                                                                                                 try{
                                                                                                                                                                                                                                                                                                                                 const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
                                                                                                                                                                                                                                                                                                                                 if(!raw) return null;
                                                                                                                                                                                                                                                                                                                                 const o = JSON.parse(raw);
                                                                                                                                                                                                                                                                                                                                 return (o && typeof o.step==='number' && o.step>0 && o.step<STEPS.length) ? o : null;
                                                                                                                                                                                                                                                                                                                                 }catch(e){ return null; }
                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                 function clearSaved(){ try{ localStorage.removeItem(CONFIG.STORAGE_KEY); }catch(e){} }
                                                                                                                                                                                                                                                                                                                                 
                                                                                                                                                                                                                                                                                                                                 function track(event, props){
                                                                                                                                                                                                                                                                                                                                 const obj = Object.assign({event, sid:S.sid, ts:new Date().toISOString()}, props||{});
                                                                                                                                                                                                                                                                                                                                 EVENTS.push(obj);
                                                                                                                                                                                                                                                                                                                                 try{ (window.dataLayer = window.dataLayer || []).push(obj); }catch(e){}
                                                                                                                                                                                                                                                                                                                                 try{ console.log('[analytics]', obj); }catch(e){}
                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                 
                                                                                                                                                                                                                                                                                                                                 /* ============================================================
                                                                                                                                                                                                                                                                                                                                    4. DERIVED RESULT
                                                                                                                                                                                                                                                                                                                                       ============================================================ */
                                                                                                                                                                                                                                                                                                                                       function derive(){
                                                                                                                                                                                                                                                                                                                                       const d = S.desire==='custom' ? null : CONTENT.desires.find(x=>x.id===S.desire);
                                                                                                                                                                                                                                                                                                                                       const feel = CONTENT.feelings.find(f=>f.id===S.ladder.q3);
                                                                                                                                                                                                                                                                                                                                       const needIds = [...new Set([d&&d.need, feel&&feel.need].filter(Boolean))];
                                                                                                                                                                                                                                                                                                                                       const barrier = CONTENT.barriers.find(b=>b.id===S.barrier);
                                                                                                                                                                                                                                                                                                                                       const type = CONTENT.types[barrier.type];
                                                                                                                                                                                                                                                                                                                                       const no = S.freedom.filter(v=>v==='no').length;
                                                                                                                                                                                                                                                                                                                                       const unsure = S.freedom.filter(v=>v==='unsure').length;
                                                                                                                                                                                                                                                                                                                                       const yes = S.freedom.filter(v=>v==='yes').length;
                                                                                                                                                                                                                                                                                                                                       const mainAreaId = d ? d.area : (S.areas.find(a=>a!=='unknown') || 'self');
                                                                                                                                                                                                                                                                                                                                       const mainArea = CONTENT.areas.find(a=>a.id===mainAreaId);
                                                                                                                                                                                                                                                                                                                                       const desireText = d ? d.label : (S.desireCustom||'').trim();
                                                                                                                                                                                                                                                                                                                                       const needWords = needIds.map(n=>CONTENT.needs[n].label);
                                                                                                                                                                                                                                                                                                                                       const insight = d
                                                                                                                                                                                                                                                                                                                                       ? (needWords.length>1
                                                                                                                                                                                                                                                                                                                                       ? `Похоже, твоё желание не только про ${d.short}. Оно про ${needWords[0]} и ${needWords[1]}.`
                                                                                                                                                                                                                                                                                                                                       : `Похоже, твоё желание про ${needWords[0]}, и ${d.short} лишь один из путей к ней.`)
                                                                                                                                                                                                                                                                                                                                       : `Похоже, за твоим желанием стоит ${needWords[0] || 'что-то важное'}.`;
                                                                                                                                                                                                                                                                                                                                       return {d, feel, needIds, needWords, barrier, type, no, unsure, yes, mainArea, desireText, insight};
                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                       const VAR_LIMIT = 250;           // строковая переменная SendPulse принимает до 255 символов
                                                                                                                                                                                                                                                                                                                                       const URL_LIMIT = 2500;          // с запасом ниже типичных 8 КБ; если SendPulse обрежет, снизить
                                                                                                                                                                                                                                                                                                                                       function tuesdayText(){
                                                                                                                                                                                                                                                                                                                                       const parts = [];
                                                                                                                                                                                                                                                                                                                                       for(const q of CONTENT.day){
                                                                                                                                                                                                                                                                                                                                       if(q.k==='feel') continue;
                                                                                                                                                                                                                                                                                                                                       if(q.k==='hours') parts.push(`${S.day.hours} ч работы`);
                                                                                                                                                                                                                                                                                                                                       else if(S.day[q.k]) parts.push(S.day[q.k]);
                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                       return parts.join(' · ');
                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                       function payload(){
                                                                                                                                                                                                                                                                                                                                       const D = derive();
                                                                                                                                                                                                                                                                                                                                       const clip = s => String(s||'').trim().slice(0, VAR_LIMIT);
                                                                                                                                                                                                                                                                                                                                       const feelNeed = D.feel ? CONTENT.needs[D.feel.need].code : '';
                                                                                                                                                                                                                                                                                                                                       // Имена переменных должны быть заранее созданы в Audience SendPulse (тип String, score и no — Number)
                                                                                                                                                                                                                                                                                                                                       const vars = {
                                                                                                                                                                                                                                                                                                                                       karta_sid: S.sid,
                                                                                                                                                                                                                                                                                                                                       karta_type: D.type.code,
                                                                                                                                                                                                                                                                                                                                       karta_type_title: D.type.title,
                                                                                                                                                                                                                                                                                                                                       karta_area: D.mainArea.code,
                                                                                                                                                                                                                                                                                                                                       karta_area_label: D.mainArea.label,
                                                                                                                                                                                                                                                                                                                                       karta_score: S.score,
                                                                                                                                                                                                                                                                                                                                       karta_barrier: D.barrier.code,
                                                                                                                                                                                                                                                                                                                                       karta_need: feelNeed,
                                                                                                                                                                                                                                                                                                                                       karta_desire: clip(D.desireText),
                                                                                                                                                                                                                                                                                                                                       karta_insight: clip(D.insight),
                                                                                                                                                                                                                                                                                                                                       karta_freedom: clip(CONTENT.freedomResult(D.no, D.unsure)),
                                                                                                                                                                                                                                                                                                                                       karta_tuesday: clip(tuesdayText())
                                                                                                                                                                                                                                                                                                                                       };
                                                                                                                                                                                                                                                                                                                                       const link = v => `https://tg.pulse.is/${CONFIG.BOT}?start=${CONFIG.FLOW_ID}&` +
                                                                                                                                                                                                                                                                                                                                       Object.entries(v).map(([k,x])=>`${k}=${encodeURIComponent(x)}`).join('&');
                                                                                                                                                                                                                                                                                                                                       let deep = link(vars);
                                                                                                                                                                                                                                                                                                                                       const sent = Object.assign({}, vars);
                                                                                                                                                                                                                                                                                                                                       for(const drop of ['karta_tuesday','karta_freedom']){
                                                                                                                                                                                                                                                                                                                                       if(deep.length <= URL_LIMIT) break;
                                                                                                                                                                                                                                                                                                                                       delete sent[drop]; deep = link(sent);
                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                       if(deep.length > URL_LIMIT){ sent.karta_desire = sent.karta_desire.slice(0,80); deep = link(sent); }
                                                                                                                                                                                                                                                                                                                                       return {
                                                                                                                                                                                                                                                                                                                                       vars: sent,
                                                                                                                                                                                                                                                                                                                                       deep_link: deep,
                                                                                                                                                                                                                                                                                                                                       full: {
                                                                                                                                                                                                                                                                                                                                       sid:S.sid, name:S.name||null, areas:S.areas, main_area:D.mainArea.id, score:S.score,
                                                                                                                                                                                                                                                                                                                                       freedom:{answers:S.freedom, no:D.no, unsure:D.unsure, yes:D.yes},
                                                                                                                                                                                                                                                                                                                                       ideal_day:S.day,
                                                                                                                                                                                                                                                                                                                                       desire:{id:S.desire, text:D.desireText},
                                                                                                                                                                                                                                                                                                                                       ladder:{why:S.ladder.q1, gives:S.ladder.q2, feeling:D.feel?D.feel.label:null},
                                                                                                                                                                                                                                                                                                                                       needs:D.needIds, barrier:D.barrier.id, type:D.type.code
                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                       };
                                                                                                                                                                                                                                                                                                                                       }
