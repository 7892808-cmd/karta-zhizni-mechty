                                                                                                                                                                                                                                                                                                                                             const dots = (n,i) => `<div class="dots" aria-hidden="true">${Array.from({length:n},(_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`;
                                                                                                                                                                                                                                                                                                                                             
                                                                                                                                                                                                                                                                                                                                             function ornament(){
                                                                                                                                                                                                                                                                                                                                             const cx=110, cy=110, n=7;
                                                                                                                                                                                                                                                                                                                                             let s = `<svg class="orn" viewBox="0 0 220 220" aria-hidden="true" fill="none">`;
                                                                                                                                                                                                                                                                                                                                             [30,60,90].forEach(r=>{ s += `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="var(--line)"/>`; });
                                                                                                                                                                                                                                                                                                                                             for(let k=0;k<n;k++){
                                                                                                                                                                                                                                                                                                                                             const a = (-90 + k*360/n) * Math.PI/180;
                                                                                                                                                                                                                                                                                                                                             const x = cx+Math.cos(a)*100, y = cy+Math.sin(a)*100;
                                                                                                                                                                                                                                                                                                                                             s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`;
                                                                                                                                                                                                                                                                                                                                             if(k===2) s += `<circle cx="${(cx+Math.cos(a)*68).toFixed(1)}" cy="${(cy+Math.sin(a)*68).toFixed(1)}" r="4" fill="var(--accent)"/>`;
                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                                                             return s + `</svg>`;
                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                                                             
                                                                                                                                                                                                                                                                                                                                             function radar(D){
                                                                                                                                                                                                                                                                                                                                             const cx=180, cy=160, R=92, LR=110, n=CONTENT.radarOrder.length;
                                                                                                                                                                                                                                                                                                                                             const pt = (k,r) => { const a=(-90+k*360/n)*Math.PI/180; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
                                                                                                                                                                                                                                                                                                                                             let g = '';
                                                                                                                                                                                                                                                                                                                                             [.33,.66,1].forEach(f=>{
                                                                                                                                                                                                                                                                                                                                             g += `<polygon class="ring" points="${CONTENT.radarOrder.map((_,k)=>pt(k,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')}"/>`;
                                                                                                                                                                                                                                                                                                                                             });
                                                                                                                                                                                                                                                                                                                                             CONTENT.radarOrder.forEach((_,k)=>{ const p=pt(k,R); g += `<line class="spoke" x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`; });
                                                                                                                                                                                                                                                                                                                                             const level = id => id===D.mainArea.id ? 5 : (S.areas.includes(id) ? 3.2 : 1.3);
                                                                                                                                                                                                                                                                                                                                             const pts = CONTENT.radarOrder.map((id,k)=>pt(k, R*level(id)/5));
                                                                                                                                                                                                                                                                                                                                             g += `<polygon class="shape" points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}"/>`;
                                                                                                                                                                                                                                                                                                                                             pts.forEach(p=>{ g += `<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`; });
                                                                                                                                                                                                                                                                                                                                             CONTENT.radarOrder.forEach((id,k)=>{
                                                                                                                                                                                                                                                                                                                                             const a=(-90+k*360/n)*Math.PI/180, p=pt(k,LR), c=Math.cos(a);
                                                                                                                                                                                                                                                                                                                                             const anchor = Math.abs(c)<.2 ? 'middle' : (c>0?'start':'end');
                                                                                                                                                                                                                                                                                                                                             const cls = id===D.mainArea.id ? 'main' : (S.areas.includes(id) ? 'sel' : '');
                                                                                                                                                                                                                                                                                                                                             const dy = Math.sin(a)>.5 ? 10 : (Math.sin(a)<-.5 ? -2 : 4);
                                                                                                                                                                                                                                                                                                                                             g += `<text class="lbl ${cls}" x="${p[0].toFixed(1)}" y="${(p[1]+dy).toFixed(1)}" text-anchor="${anchor}">${esc(CONTENT.areas.find(a=>a.id===id).radar)}</text>`;
                                                                                                                                                                                                                                                                                                                                             });
                                                                                                                                                                                                                                                                                                                                             return `<svg class="radar" viewBox="0 0 360 320" role="img" aria-label="Карта сфер жизни: главная сфера — ${esc(D.mainArea.radar||D.mainArea.label)}">${g}</svg>`;
                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                                                             
                                                                                                                                                                                                                                                                                                                                             function chain(items){
                                                                                                                                                                                                                                                                                                                                             return `<div class="chain">${items.map(([l,t])=>`<p><span>${esc(l)}</span>${esc(t)}</p>`).join('')}</div>`;

                                                                                                                                                                                                                                                                                                                                             function optList(opts, selected, act, extra){

                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                                                             
                                                                                                                                                                                                                                                                                                                                             const VIEWS = {

                                                                                                                                                                                                                                                                                                                                             const text = CONTENT.share.replace('{type}', D.type.title);
                                                                                                                                                                                                                                                                                                                                             return `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
                                                                                                                                                                                                                                                                                                                                             }
